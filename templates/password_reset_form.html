{% extends 'base.html' %}

{% block title %}
  Reset password / SIPPER
{% endblock %}

{% block content %}
  <div class="form-page">
    <div class="form-intro">
      <p class="eyebrow">Pemulihan akun</p>
      <h1>
        Lupa<br>
        <em>password?</em>
      </h1>
      <p>Masukkan email akun Anda untuk menerima tautan pemulihan.</p>
    </div>

    <form method="post" class="form-card">
      {% csrf_token %}
      <label>
        Email
        <input type="email" name="email" required autocomplete="email" placeholder="nama@email.com">
      </label>
      <button class="button button-green" type="submit">
        Kirim tautan <span>→</span>
      </button>
    </form>
  </div>
{% endblock %}
