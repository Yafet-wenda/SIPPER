{% extends 'base.html' %}

{% block title %}
  Pemutakhiran data / SIPPER
{% endblock %}

{% block content %}
  <div class="form-page">
    <div class="form-intro">
      <p class="eyebrow">Pemutakhiran data</p>
      <h1>
        Perbarui<br>
        <em>perjalanan Anda.</em>
      </h1>
      <p>Gunakan halaman ini saat alamat tujuan atau alasan merantau berubah.</p>
    </div>

    <form method="post" class="form-card">
      {% csrf_token %}
      <label>
        Nama lengkap
        <input id="nama-display" value="{{ person.nama }}" disabled>
      </label>
      <label>
        NIK
        <input id="nik-display" value="{{ person.nik }}" disabled>
      </label>
      <label>
        Daerah asal
        <input name="origin" value="{{ person.daerah_asal }}" required>
      </label>
      <label>
        Kota tujuan
        <input name="destination" value="{{ person.kota_tujuan }}" required>
      </label>
      <label>
        Tujuan merantau
        <select name="purpose" required>
          {% for nilai, label in tujuan_pilihan %}
            <option value="{{ nilai }}" {% if person.tujuan == nilai %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>
      <button class="button button-green" type="submit">
        Simpan perubahan <span>→</span>
      </button>
    </form>
  </div>
{% endblock %}
