{% extends 'base.html' %}

{% block title %}
  Ganti password / SIPPER
{% endblock %}

{% block content %}
  <div class="form-page">
    <div class="form-intro">
      <p class="eyebrow">Keamanan akun</p>
      <h1>
        Ganti<br>
        <em>password.</em>
      </h1>
      <p>Gunakan password yang kuat dan tidak dipakai di layanan lain.</p>
    </div>

    <form method="post" class="form-card">
      {% csrf_token %}
      {% for field in form %}
        <label>
          {{ field.label }}
          {{ field }}
          {% if field.errors %}
            <small class="error-text">{{ field.errors|striptags }}</small>
          {% endif %}
        </label>
      {% endfor %}
      <button class="button button-green" type="submit">
        Simpan password <span>→</span>
      </button>
    </form>
  </div>
{% endblock %}
