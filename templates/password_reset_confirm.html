{% extends 'base.html' %}

{% block title %}
  Password baru / SIPPER
{% endblock %}

{% block content %}
  <div class="form-page">
    <div class="form-intro">
      <p class="eyebrow">Pemulihan akun</p>
      <h1>
        Buat password<br>
        <em>baru.</em>
      </h1>
    </div>

    <form method="post" class="form-card">
      {% csrf_token %}
      {% for field in form %}
        <label>
          {{ field.label }}
          {{ field }}
        </label>
      {% endfor %}
      <button class="button button-green" type="submit">
        Simpan password <span>→</span>
      </button>
    </form>
  </div>
{% endblock %}
