# =====================================================================
#  SIPPER - Apache sebagai reverse proxy ke waitress
#
#  File ini TEMPLATE sumber. Yang dibaca Apache adalah salinannya di
#  <XAMPP>\apache\conf\extra\httpd-sipper.conf, dengan token
#  __PROJECT_ROOT__ sudah diganti ke lokasi folder proyek. Jadi kalau perlu
#  mengubah isi di bawah: edit template ini, lalu pasang ulang dengan
#      powershell -ExecutionPolicy Bypass -File scripts\install-apache-config.ps1
#
#  Butuh modul mod_proxy + mod_proxy_http + mod_headers; installer di atas
#  yang memastikan ketiganya aktif di httpd.conf.
# =====================================================================

# Static dilayani Apache langsung, dari hasil "manage.py collectstatic".
# Storage static sengaja memakai nama file tanpa hash
# (whitenoise.storage.CompressedStaticFilesStorage) supaya URL /static/ yang
# ditulis template tetap sah setelah deploy ulang.
Alias /static/ "__PROJECT_ROOT__/staticfiles/"
<Directory "__PROJECT_ROOT__/staticfiles">
    Require all granted
    AllowOverride None
    Options -Indexes
    Header set Cache-Control "public, max-age=86400"
</Directory>

# /media/ SENGAJA tidak diberi Alias. Dokumen penduduk hanya boleh keluar
# lewat view yang memeriksa hak akses, jadi tidak ada jalur langsung dari URL
# ke disk. Kalau Alias /media/ ditambahkan di sini, proteksinya tembus.

ProxyPreserveHost On
ProxyTimeout 60

# mod_proxy sudah mengirim X-Forwarded-For (ProxyAddHeaders, default On), dan
# waitress menerimanya karena prod.bat menyalakan --trusted-proxy. Tanpa itu
# Django melihat 127.0.0.1 untuk semua orang dan rate limit login jadi satu
# kuota bersama.
#
# Setiap path yang harusnya dilayani Apache sendiri wajib dibebaskan lebih
# dulu. Di mesin ini terbukti "ProxyPass /" menang atas "Alias": tanpa baris
# "!" di bawah, /static/ ikut diproxy ke waitress dan /phpmyadmin hilang.
ProxyPass /static !
ProxyPass /phpmyadmin !

ProxyPass / http://127.0.0.1:8099/
ProxyPassReverse / http://127.0.0.1:8099/

# Catatan TLS: kalau nanti Apache melayani :443 untuk SIPPER, tambahkan di
# dalam <VirtualHost *:443> baris
#     RequestHeader set X-Forwarded-Proto "https"
# baru kemudian DJANGO_SECURE_SSL_REDIRECT=1 dan DJANGO_SECURE_COOKIES=1 boleh
# dinyalakan. Tanpa header itu Django tidak pernah punya bukti HTTPS dan
# SECURE_PROXY_SSL_HEADER menganggur.
